<!DOCTYPE html>
<html>
  <head>

    <title>Zap-A-Ghost &#128123;</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- CSS styles: This is for me to worry about; not you. -->
	<link href="css/game.css" rel="stylesheet" />
	<link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Nosifer+Caps" />
	
	<script src="js/jquery-1.11.3.min.js"></script>
	<!--<script src="http://code.jquery.com/jquery-1.11.3.min.js"></script>--> 
	<script>
	var usrScore=0;
	var timer=31;
	var count=0;
	var difficulty='medium';
	var totalGhosts=40;
	var spawnedCount=0;
	var resolvedCount=0;
	var ghostTimers={};
	var gameEnded=false;
	var counterTimeout;

	var difficultySettings = {
		easy:   { minSpawn: 250, maxSpawn: 550, minVisible: 2200, maxVisible: 3800 },
		medium: { minSpawn: 200, maxSpawn: 450, minVisible: 1200, maxVisible: 3000 },
		hard:   { minSpawn: 100, maxSpawn: 300, minVisible: 500,  maxVisible: 1200 }
	};

$(document).ready( function() {

$("#start_button").click(function(){
    difficulty = $('input[name="difficulty"]:checked').val();
    start();
	addMole();
	$("#gamespace").on('click', "img",function(){
		resolveGhost($(this).attr('id'), true);
	});
});
});
//generate mole's position, relative to the current gamespace size
function yPosition(){
	var maxY = $('#gamespace').height() - 60;
	return Math.round(Math.random() * Math.max(maxY, 0)) + 1;
}
function xPosition(){
	var maxX = $('#gamespace').width() - 60;
	return Math.round(Math.random() * Math.max(maxX, 0)) + 1;
}

//Generated when Mole appears, spawn rate depends on difficulty
function moleTime(){
	var s = difficultySettings[difficulty];
	return Math.round(s.minSpawn + Math.random() * (s.maxSpawn - s.minSpawn));
}

//increase player's score
function addScore(){
	usrScore+=1;
	$("#score").html(usrScore + " / " + totalGhosts + " pts");
	}
function start(){
usrScore=0;
timer=31;
count=0;
spawnedCount=0;
resolvedCount=0;
ghostTimers={};
gameEnded=false;
$("#score").html("0 / " + totalGhosts + " pts");
$('#timer').show();
changeColor();
counter();
$("button").off();
$('input[name="difficulty"]').prop('disabled', true);
}

function counter(){
if(gameEnded){ return; }
if(timer>=0){
counterTimeout=setTimeout("counter()", 1000);
$("#timer").html(timer + " seconds left");
timer=timer-1;
}
else{
endGame();
}
}
function addMole(){
if(gameEnded || spawnedCount>=totalGhosts){ return; }
 yPos=yPosition();
 xPos=xPosition();
 var id='image'+count;
 spawnedCount++;

 if(spawnedCount<totalGhosts){
	 t=setTimeout("addMole()", moleTime());
 }
$('#gamespace').append('<img id="'+id+'" src="img/Ghost_One.png" alt="A ghost to zap" style="top:'+yPos+'px;left:'+xPos+'px;"  />');
 count++
 removeGhost(id);
}
function removeGhost(id) {
	var s = difficultySettings[difficulty];
	var visibleFor = s.minVisible + Math.random() * (s.maxVisible - s.minVisible);
	ghostTimers[id] = window.setTimeout(function() {
		resolveGhost(id, false);
	}, visibleFor);
}

//a ghost is "resolved" once, whether it was clicked or it faded away unclicked
function resolveGhost(id, wasClicked){
	if(!ghostTimers.hasOwnProperty(id)){ return; }
	clearTimeout(ghostTimers[id]);
	delete ghostTimers[id];

	var $ghost = $('#'+id);
	if(wasClicked){
		addScore();
	}
	$ghost.fadeOut(150, function(){ $(this).remove(); });

	resolvedCount++;
	if(resolvedCount>=totalGhosts){
		endGame();
	}
}

function endGame(){
	if(gameEnded){ return; }
	gameEnded=true;
	clearTimeout(counterTimeout);
	$('#timer').hide();

	var half=Math.ceil(totalGhosts/2);
	var message;
	if(usrScore>=totalGhosts){
		message="You're amazing! Have you considered a career in Ghost Hunting?";
	}
	else if(usrScore>=half){
		message="Not too shabby!";
	}
	else{
		message="Maybe don't quit your day job.";
	}
	alert(message + "\nYour score: " + usrScore + " / " + totalGhosts);
	location.reload();
}

function changeColor(){
$("#gamespace").css("background-color","rgba(255,0,0,.5)");
$("h1").css("color","rgb(255,0,0)");
}
	</script>
    
  </head>
  <body>

	<div id="content">

		<h1>Ghost in the Machine</h1>
		
		<p>After clicking "start", you will have 30 seconds to zap
		as many of the 40 ghosts as you can. The ghosts appear randomly so be ready! </p>

		<div id="difficulty">
			<span>Difficulty:</span>
			<label><input type="radio" name="difficulty" value="easy"> Easy</label>
			<label><input type="radio" name="difficulty" value="medium" checked> Medium</label>
			<label><input type="radio" name="difficulty" value="hard"> Hard</label>
		</div>

		<div id="controls">
			<span id="score">0 / 40 pts</span>
			<button type="button" id="start_button">Start!</button>
		</div>
		
		<div id="timer"></div>
		
		<div id="gamespace">

			
			
		</div>
		
	</div>
  </body>
</html>
